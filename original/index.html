DIA_002:"And it feels like someone is wringing a wet towel right in my uterus. Ouch.",DIA_003:"Great. A wisp. If you're trying to lure me into some dark hole, I'm warning you.",DIA_004:"I'm not in the mood and definitely don't have the right shoes.",DIA_005:"Well, your 'special visitor' has officially arrived. Fatigue? Bloated belly? Everything hurts?",DIA_006:"Well, this is your time for some real rest. If the pain doesn't feel like medieval torture right now...",DIA_007:"...besides a handful of pink pills, some exercises or breathing might help. By the way, I'm Estra.",DIA_008:"Slow inhale for 4 counts, hold for 2, and then a looong exhale for 6.",DIA_009:"Repeat this mini zen session at least 6 times and maybe, just maybe, your uterus will finally calm down and leave you alone.",DIA_009_FINAL:"Deep breaths... better, right? But don’t get too comfortable just yet. Now that your pulse isn't racing like a runaway train, it’s time to head deeper. We’re going into the cavern of your own biology. Shall we?",DIA_B00:"Press and hold the <KB>UP arrow</KB><GP>D-pad ⬆️</GP> to inhale (4 seconds), then release to hold your breath (2 seconds), and finally hold the <KB>DOWN arrow</KB><GP>D-pad ⬇️</GP> to exhale (6 seconds).",DIA_B01:"Great job, your body is relaxing. Keep it up.",DIA_B02:"Excellent! The tension is slowly leaving. Keep this rhythm.",DIA_B03:"You're doing great, exactly like this.",DIA_B04:"Feel how your breath helps you? Well done.",DIA_B05:"Beautiful cycle, keep going.",DIA_B06:"Never mind, let's try again. Focus on the rhythm.",DIA_B07:"That's okay, inhale up, exhale down.",DIA_B08:"You lost the rhythm, but that's fine. Let's go again.",DIA_B09:"Reminder: Inhale (hold <KB>UP</KB><GP>D-pad ⬆️</GP> 4 seconds), hold (release for 2 seconds), exhale (hold <KB>DOWN</KB><GP>D-pad ⬇️</GP> 6 seconds). Breathing chases away cramps.",DIA_B10:"Focus. Inhale... 4, hold... 2, exhale... 6.",DIA_B11:"Just breathe.",DIA_010:"Dive deep inside yourself, jump on these platforms and tackle the minigames...",DIA_011:"...to try and collect at least some of that lost iron before you turn into a limp ragdoll. Good luck!",DIA_012:"Watch out for menstrual cramps! Use <KB>arrows</KB><GP>D-pad</GP> to move, <KB>UP/Space/W</KB><GP>🟡</GP> to jump, and hold <KB>Shift</KB><GP>🟢</GP> to run. You can look down if you're not sure.",DIA_013:"This is a menstrual cramp. Just avoid it for now, or try to destroy it with your breath (press <KB>CTRL</KB><GP>🔴</GP>).",DIA_014:"Recharge your energy with the breathing cycle you learned. You can do this!",DIA_015:"Have an uncontrollable urge to devour everything sweet within a five-mile radius? I totally get you.",DIA_016:"Your mission is clear: try to put these scattered pieces of chocolate together.",DIA_017:"If you manage to do it without losing your last bit of patience, a sweet reward might be waiting for you at the end.",DIA_018:"Arrange the individual chocolate pieces in the correct order.",DIA_019:"The chocolate is assembled, YUM! Sugar is great for an instant mood boost and quick energy (yay, happy brain!).",DIA_020:"But watch out, there's a catch. When you eat too many sweets at once, your body goes on a crazy roller coaster.",DIA_021:"First you fly up to the clouds, but then comes a steep drop, suddenly you're super tired...",DIA_022:"...your belly is like a balloon and those grumpy cramps can get even angrier. So, what's the plan?",DIA_023:"Fatigue has hit hard and you'd love to drink a pool of coffee? Hold on! Your body needs something completely different right now.",DIA_024:"Your task is to connect the pipes so that clean water reaches you.",DIA_025:"Divert the coffee somewhere else, otherwise your tummy will be really grumpy. Let's get to plumbing!",DIA_026:"You did it! Clean water is flowing and the coffee that would only make your cramps worse is safely away.",DIA_027:"Great job, successful hydration reported! Why did we actually send the coffee away?",DIA_028:"Caffeine and a bunch of sugar act in the body like little gremlins that constrict your blood vessels.",DIA_029:"Narrower vessels mean worse blood flow and... guess what? Much stronger cramps!",DIA_030:"And why drink water when you already feel like a walking water balloon? Sounds weird...",DIA_031:"...but when your body retains water, the best way to tell it 'hey, you don't need to hoard it anymore' is to drink even more!",DIA_032:"Clean water flushes everything out nicely and that annoying bloated feeling will finally disappear. Cheers!",DIA_033:"Have you ever wondered where all the money from your piggy bank goes every month? Spoiler: It's not just sweets.",DIA_034:"Over a lifetime, menstruation can cost you as much as a luxury handbag or even a used car!",DIA_035:"But it's not just about money, our planet pays its toll too.",DIA_036:"Match the lifetime investment amounts to the correct menstrual products.",DIA_037:"Think carefully, does a reusable cup cost more or less than 11,000 disposable pads?",DIA_038:"Reveal the impact: When you match the prices correctly, you unlock the ecological footprint. You'll find out how many kilos of waste each choice leaves behind!",DIA_039:"Did the results surprise you? For millions of people, even the cheapest pads are a luxury.",DIA_040:"This is period poverty and it's not just a problem 'somewhere far away'.",DIA_041:"In the EU, 1 in 10 women has to choose between food and pads. Worldwide, 500 million people lack basic needs...",DIA_042:"...which forces them to use rags or even newspapers (ouch!). Because of this, girls miss up to 20% of the school year.",DIA_043:"Menstruation is not a luxury, it's a right. It's time to break this cycle!",DIA_044:"It's time to face the Big Cramp! Use your iron to destroy its spikes, but watch out, every hit costs you supplies.",DIA_045:"Ran out of iron? You'll feel like a dead battery. Don't forget to breathe to shrink the monster!",DIA_046:"Climb the walls and show this cycle who's boss. 4 - 2 - 6!",DIA_047:"Victory! The cramp is defeated! You dodged that giant ball of agony, used collected iron to destroy its spikes...",DIA_048:"...and breathed like a true zen master. The big boss has officially shrunk to nothing.",DIA_049:"Your uterus is at peace and you are the champion of the cycle. Go get a snack, you deserve it!",DIA_050:"By collecting so much iron, you not only destroyed the cramp, but prepared your body for the next big comeback.",DIA_051:"Since you lose quite a bit of iron during menstruation, replenishing it is key. It's like fuel for the next phase of your cycle.",DIA_052:"This iron will help your body build a healthy, oxygen-rich environment for the next egg and ensure you don't walk around like a tired zombie for the rest of the month.",DIA_053:"Ouch... The cramp won (this time). Well, that didn't go exactly according to plan.",DIA_054:"It turns out that giant, spiky ball of suffering was faster than you expected.",DIA_055:"Instead of destroying its spikes with iron, it kind of destroyed your will to move.",DIA_056:"Don't worry, the heating pad is already warming up for you. Take a deep breath (a real one this time!), rest, and get ready for a rematch. It's not over yet!",BTN_WALK:"Walk it off!",BTN_BREATHE:"Breathe!",BTN_START_BREATHING:"Start breathing",BTN_GOT_IT:"Got it!",BTN_YES_MAAM:"Yes, ma'am!",BTN_LETS_DO_THIS:"Let's do this!",BTN_START:"START",BTN_DEVOUR:"Devour it all!",BTN_PIECE:"Just a piece.",BTN_DRINK:"Let's drink!",BTN_CONTINUE:"Continue!",BTN_UNDERSTAND:"I understand!",BTN_CALCULATE:"Let's calculate!",BTN_EVALUATE:"Evaluate!",BTN_YES:"They did!",BTN_NO:"Not really!",BTN_EXACTLY:"Exactly!",BTN_BATTLE:"To battle!",BTN_BACK_MENU:"Back to menu!",BTN_RESTART:"Restart!",BTN_NEXT:"Next",BTN_UNDERSTOOD:"Understood",BTN_TRY_AGAIN:"Try again!",BTN_RETRY_FIGHT:"Retry fight",BTN_RESTART_CAVE:"Restart cave",BTN_BACK_MENU_UI:"Back to menu",BTN_SKIP_INTRO:"Skip intro",BTN_CREDITS:"CREDITS",UI_DEVELOPER_MODE:"Developer mode",UI_WORK_IN_PROGRESS:"Work In Progress",PRODUCT_PADS:"Disposable pads and tampons",PRODUCT_PANTIES:"Menstrual panties",PRODUCT_CUP:"Menstrual cup",IMPACT_HIGH:`High

footprint`,DIA_A_01:"Welcome to the cave! Your journey begins here. You'll need to collect iron to stay strong and avoid cramps.",DIA_A_02:"Use the <KB>LEFT and RIGHT arrow keys</KB><GP>D-pad</GP> to move. Press <KB>UP</KB><GP>🟡</GP> to jump.",DIA_A_03:"To get out of this pit, you'll need to double jump. Press <KB>UP</KB><GP>🟡</GP> while in the air to jump again. Grab that iron nut up there!",UI_TOO_MUCH_PAIN:"Too much pain...",UI_CRAMPS_OVERWHELMED:"The cramps have completely overwhelmed you. You need a moment to rest before trying again.",UI_FALLING_DEPTHS:"Falling into the depths...",UI_PAIN_PULLED_DOWN:"The pain has pulled you down. Will you try again?",UI_LOADING_ASSETS:"Loading Assets...",UI_CLICK_TO_START:"Click to Start",UI_SUBTITLES:"Subtitles",UI_SWITCH_FULLSCREEN:"Full screen",NAME_ESTRA:"Estra",CREDIT_IDEA:"IDEA AND DESIGN",CREDIT_CODE:"CODE",CREDIT_VISUALS:"VISUALS",CREDIT_SOUND:"SOUND AND MUSIC",CREDIT_VOICES:"VOICES"},sk:{DIA_001:"Haló? Je tu niekto? Cítim sa… ťažko. Akoby som celú noc jazdila na kolotoči.",DIA_002:"A mám pocit, že mi niekto žmýka mokrý uterák priamo v maternici. Au.",DIA_003:"Výborne. Bludička. Ak ma chceš nalákať do nejakej temnej diery, tak ťa varujem.",DIA_004:"Nemám náladu ani topánky na takéto výlety.",DIA_005:"No krása, tvoj ‘špeciálny návštevník’ oficiálne dorazil. Únava? Nafukovanie? Bolesti úplne všade?",DIA_006:"Nuž, je čas na poriadny oddychový režim. Ak bolesť práve nepripomína stredoveké mučenie…",DIA_007:"...okrem hrste ružových tabletiek môžu pomôcť aj špeciálne cviky alebo dýchanie. Mimochodom, ja som Estrogénka.",DIA_008:"Pomaly sa nadýchni na 4 doby, zadrž dych na 2 a potom veľmi pomaly vydychuj na 6.",DIA_009:"Tento malý zenový rituál zopakuj aspoň 6-krát a možno – len možno – sa tvoja maternica trochu upokojí a nechá ti vydýchnuť.",DIA_009_FINAL:"Predýchaná... lepšie, však? Ale ešte nepoľavuj... Teraz, keď nemáš vystrelený tep do nebies, je čas vyraziť hlbšie. Ideme do centra tvojho ja. Pripravená?",DIA_B00:"Stlač a podrž <KB>šípku nahor</KB><GP>D-pad ⬆️</GP> na nádych (4 sekundy), potom uvoľni a zadrž dych (2 sekundy) a nakoniec podrž <KB>šípku nadol</KB><GP>D-pad ⬇️</GP> na výdych (6 sekúnd).",DIA_B01:"Tvoje telo sa uvoľňuje, ide ti to skvelo. Len tak ďalej!",DIA_B02:"Výborne! Napätie sa rozplýva. Plynule pokračuj.",DIA_B03:"Presne takto, dobrá práca!",DIA_B04:"Cítiš, ako ti dych pomáha?",DIA_B05:"Krásny cyklus, len tak ďalej..",DIA_B06:"Nevadí, ďalší cyklus ti to pôjde ešte lepšie. Sústreď sa na rytmus.",DIA_B07:"V pohode, pokoj a skús znova. Zachovaj plynulosť, rátaj.",DIA_B08:"Rytmus sa stráca, ale to je v poriadku. Skús to ešte raz.",DIA_B09:"Pripomienka: Nadýchni sa (drž <KB>šípku nahor</KB><GP>D-pad ⬆️</GP> 4 sekundy), zadrž dych (uvoľni na 2 sekundy), vydýchni (drž <KB>šípku nadol</KB><GP>D-pad ⬇️</GP> 6 sekúnd). Dýchanie pomáha zahnať kŕče.",DIA_B10:"Sústreď sa. Na 4 nádych – na 2 zadrž – na 6 výdych.",DIA_B11:"Len dýchaj.",DIA_010:"Ponor sa hlboko do seba. Preskakuj plošiny a vyrieš mini hry.",DIA_011:"Pokús sa pozbierať aspoň časť strateného železa skôr, než sa zmeníš na handrovú bábiku bez energie. Veľa šťastia!",DIA_012:"Pohybuj sa pomocou <KB>šípok</KB><GP>D-padu</GP>, skáč a sprav dvojskok <KB>šípkou hore</KB><GP>🟡</GP>. Pre beh drž <KB>Shift</KB><GP>🟢</GP>. Ak si nie si istá, pozri sa dolu šípkou dole.",DIA_013:"Toto je menštruačný kŕč. Zatiaľ sa mu vyhýbaj alebo ho skús zničiť pomocou dychu (stlač <KB>CTRL</KB><GP>🔴</GP>).",DIA_014:"Nabíjaj ho naučeným dychovým cyklom. Zvládneš to!",DIA_015:"Máš neovládateľnú chuť zjesť všetko sladké v okruhu piatich kilometrov? Úplne chápem.",DIA_016:"Tvoja misia je jasná: poskladaj tieto rozhádzané kúsky čokolády.",DIA_017:"Ak to zvládneš bez straty posledného zvyšku trpezlivosti, na konci ťa možno čaká sladká odmena.",DIA_018:"Usporiadaj jednotlivé kúsky čokolády v správnom poradí.",DIA_019:"Misia čokoláda úspešná – mňam! Cukor je skvelý na rýchle zlepšenie nálady a okamžitý príval energie (juchú, šťastný mozog!).",DIA_020:"Ale pozor, má to háčik. Príliš veľa sladkého naraz pošle tvoje telo na poriadnu horskú dráhu.",DIA_021:"Najprv vyletíš do oblakov, potom príde prudký pád.",DIA_022:"Únava, nafúknuté brucho a kŕče ešte silnejšie než predtým. Takže aký je plán?",DIA_023:"Únava udrela naplno a najradšej by si vypila bazén kávy? Zadrž! Tvoje telo teraz potrebuje niečo úplne iné.",DIA_024:"Tvojou úlohou je prepojiť potrubia tak, aby sa k tebe dostala čistá voda.",DIA_025:"Kávu pošli do koša, inak bude tvoje brucho poriadne mrzuté. Poďme na inštalatérsku misiu!",DIA_026:"Zvládnuté! Príval hydratácie je na ceste a káva, ktorá spúšťa kŕče, je bezpečne mimo hry.",DIA_027:"Skvelá práca, hydratácia úspešná! Prečo sme vlastne poslali kávu preč?",DIA_028:"Kofeín a veľké množstvo cukru fungujú v tele ako malí gremlini – sťahujú cievy.",DIA_029:"A stiahnuté cievy znamenajú menší prietok krvi a… hádaj čo? Oveľa silnejšie kŕče!",DIA_030:"A prečo piť vodu, keď sa cítiš ako chodiaci vodný balón? Znie to čudne...",DIA_031:"...ale keď telo zadržiava vodu, najlepší spôsob, ako mu povedať „už nemusíš“, je dodať mu jej viac.",DIA_032:"Čistá voda všetko pekne prepláchne a nepríjemný pocit nafúknutia konečne splasne. Na zdravie!",DIA_033:"Rozmýšľala si niekedy, kam každý mesiac miznú peniaze z tvojho prasiatka? Malý spoiler: nie sú to len sladkosti.",DIA_034:"Počas života môže manažment menštruácie stáť toľko, čo luxusná kabelka alebo dokonca ojazdené auto.",DIA_035:"A nejde len o peniaze – účet platí aj planéta.",DIA_036:"Priraď sumy celoživotnej investície k správnej menštruačnej potrebe.",DIA_037:"Premýšľaj: stojí znovupoužiteľný kalíšok viac alebo menej než 11 000 jednorazových vložiek?",DIA_038:"Odhaľ ich dopad, po správnom priradení cien sa ti zobrazí aj environmentálna stopa – koľko kilogramov odpadu každá voľba zanechá.",DIA_039:"Prekvapili ťa výsledky? Pre milióny ľudí sú aj tie najlacnejšie vložky luxusom.",DIA_040:"Menštruačná chudoba nie je vzdialený problém, môže sa týkať aj niekoho z tvojho blízkeho okolia.",DIA_041:"V Európskej únii si každá desiata žena musí vyberať medzi jedlom a hygienickými potrebami. Celosvetovo až 500 miliónov ľudí nemá prístup k základným potrebám.",DIA_042:"Sú nútení používať handry či dokonca noviny (au!). Dievčatá pre to prichádzajú až o 20 % školského roka.",DIA_043:"Menštruácia nie je luxus – je to právo. Je čas prelomiť cyklus.",DIA_044:"Je čas postaviť sa Veľkému Kŕču! Použi nazbierané železo na rozbitie jeho ostňov, ale dávaj pozor – každý zásah ťa niečo stojí.",DIA_045:"Bez železa sa budeš cítiť ako vybitá batéria. Nezabudni na dýchanie, ktoré tohto enemáka zmenšuje.",DIA_046:"Uhýbaj sa mu a ukáž, kto to tu vedie! 4 – 2 – 6!",DIA_047:"Víťazstvo! Kŕč porazený! Vyhla si sa obrovskej guli bolesti, použila si nazbierané železo na rozbitie jej ostňov…",DIA_048:"…a dýchala si ako skutočná majsterka zen chaosu. Veľký boss sa oficiálne zmenšil na nič.",DIA_049:"Tvoja maternica je v pokoji a ty si šampiónka cyklu. Choď si dať niečo malé pod zub – zaslúžiš si to!",DIA_050:"Zbieranie železa neznamenalo len poraziť kŕč. Pripravila si tým pôdu pre ďalšiu fázu cyklu.",DIA_051:"Počas menštruácie strácaš pomerne veľa železa a jeho doplnenie je kľúčové. Je to palivo pre ďalšie obdobie.",DIA_052:"Pomáha telu vytvárať zdravé prostredie pre ďalšie vajíčko a zabezpečí, že sa zvyšok mesiaca nebudeš cítiť ako unavený zombík.",DIA_053:"Au… Kŕč vyhráva (zatiaľ). Nuž, tentoraz to úplne nevyšlo.",DIA_054:"Tá obrovská pichľavá guľa utrpenia bola slnejšia, než si čakala.",DIA_055:"Namiesto rozbitia jej ostňov tvojím železom, ti tak trochu rozbila chuť sa hýbať.",DIA_056:"Nevadí – termofor sa už zohrieva. Nadýchni sa (poriadne, tentoraz!), oddýchni si a priprav sa na odvetu. Toto ešte nekončí!",BTN_WALK:"Rozchodiť to!",BTN_BREATHE:"Dýchať!",BTN_START_BREATHING:"Začať dýchať",BTN_GOT_IT:"Rozumiem!",BTN_YES_MAAM:"Áno, šéfka!",BTN_LETS_DO_THIS:"Poďme na to!",BTN_START:"ŠTART",BTN_DEVOUR:"Zjesť všetko!",BTN_PIECE:"Len kúsok.",BTN_DRINK:"Poďme piť!",BTN_CONTINUE:"Pokračovať!",BTN_UNDERSTAND:"Rozumiem!",BTN_CALCULATE:"Poďme počítať!",BTN_EVALUATE:"Vyhodnotiť!",BTN_YES:"Áno!",BTN_NO:"Ani nie!",BTN_EXACTLY:"Presne tak!",BTN_BATTLE:"Do boja!",BTN_BACK_MENU:"Späť do menu!",BTN_RESTART:"Reštartovať!",BTN_NEXT:"Ďalej",BTN_UNDERSTOOD:"Rozumiem",BTN_TRY_AGAIN:"Skúsiť znova!",BTN_RETRY_FIGHT:"Znova k bossovi",BTN_RESTART_CAVE:"Na začiatok jaskyne",BTN_BACK_MENU_UI:"Návrat do menu",BTN_SKIP_INTRO:"Preskočiť intro",BTN_CREDITS:"KREDITY",UI_DEVELOPER_MODE:"Vývojársky režim",UI_WORK_IN_PROGRESS:"Pracujeme na tom",PRODUCT_PADS:"Jednorazové vložky a tampóny",PRODUCT_PANTIES:"Menštruačné nohavičky",PRODUCT_CUP:"Menštruačný kalíšok",IMPACT_HIGH:`Vysoká

stopa`,DIA_A_01:"Vitaj v jaskyni! Tvoja cesta začína tu. Budeš musieť zbierať železo, aby si zostala silná a vyhla sa kŕčom.",DIA_A_02:"Použi <KB>šípky VĽAVO a VPRAVO</KB><GP>D-pad</GP> na pohyb. Stlač <KB>HORE</KB><GP>🟡</GP> pre skok.",DIA_A_03:"Aby si sa dostala z tejto jamy, budeš musieť urobiť dvojskok. Stlač <KB>HORE</KB><GP>🟡</GP> vo vzduchu pre ďalší skok. Zober tú železnú maticu tam hore!",UI_TOO_MUCH_PAIN:"Príliš veľa bolesti...",UI_CRAMPS_OVERWHELMED:"Kŕče ťa úplne premohli. Potrebuješ chvíľu na oddych, kým to skúsiš znova.",UI_FALLING_DEPTHS:"Pád do hlbín...",UI_PAIN_PULLED_DOWN:"Bolesť ťa stiahla so sebou. Skúsiš to znova?",UI_LOADING_ASSETS:"Načítavam assety...",UI_CLICK_TO_START:"Klikni pre štart",UI_SUBTITLES:"Titulky",UI_SWITCH_FULLSCREEN:"Celá obrazovka",NAME_ESTRA:"Estrogénka",CREDIT_IDEA:"NÁMET A DIZAJN",CREDIT_CODE:"KÓD",CREDIT_VISUALS:"VIZUÁL",CREDIT_SOUND:"ZVUK A HUDBA",CREDIT_VOICES:"HLASY"},pt:{DIA_001:"Olá? Tem alguém aí? Sinto-me... pesada. Como se alguém tivesse aumentado a gravidade ao máximo.",DIA_002:"E parece que alguém está a torcer uma toalha molhada diretamente no meu útero. Ai.",DIA_003:"Ótimo. Uma luzinha. Se estás a tentar atrair-me para algum buraco escuro, aviso-te.",DIA_004:"Não estou com disposição nem tenho os sapatos certos para estas viagens.",DIA_005:"Bem, a tua 'visita especial' chegou oficialmente. Fadiga? Barriga inchada? Dores em todo o lado?",DIA_006:"Pois bem, é hora de um descanso a sério. Se a dor não parecer tortura medieval agora...",DIA_007:"...além de um punhado de comprimidos cor-de-rosa, alguns exercícios ou respiração podem ajudar. A propósito, eu sou a Estra.",DIA_008:"Inspira lentamente durante 4 tempos, sustém por 2 e depois expira loooongamente por 6.",DIA_009:"Repete este mini ritual zen pelo menos 6 vezes e talvez, apenas talvez, o teu útero finalmente se acalme e te deixe em paz.",DIA_009_FINAL:"Recuperaste o fôlego... melhor, certo? Mas não relaxes ainda... Agora que o teu pulso não está a disparar para o céu, é hora de ir mais fundo. Vamos ao centro do teu eu. Pronta?",DIA_B00:"Prime e mantém a <KB>seta para CIMA</KB><GP>D-pad ⬆️</GP> para inspirar (4 segundos), depois solta para suster a respiração (2 segundos) e finalmente mantém a <KB>seta para BAIXO</KB><GP>D-pad ⬇️</GP> para expirar (6 segundos).",DIA_B01:"Bom trabalho, o teu corpo está a relaxar. Continua assim.",DIA_B02:"Excelente! A tensão está a sair lentamente. Mantém este ritmo.",DIA_B03:"Estás a ir muito bem, exatamente assim.",DIA_B04:"Sentes como a tua respiração te ajuda? Bem feito.",DIA_B05:"Belo ciclo, continua.",DIA_B06:"Não faz mal, vamos tentar de novo. Foca-te no ritmo.",DIA_B07:"Está tudo bem, inspira para cima, expira para baixo.",DIA_B08:"Perbeste o ritmo, mas não faz mal. Vamos outra vez.",DIA_B09:"Lembrete: Inspira (mantém <KB>CIMA</KB><GP>D-pad ⬆️</GP> 4 segundos), sustém (solta por 2 segundos), expira (mantém <KB>BAIXO</KB><GP>D-pad ⬇️</GP> 6 segundos). Respirar afasta as cólicas.",DIA_B10:"Foca-te. Inspira... 4, sustém... 2, expira... 6.",DIA_B11:"Apenas respira.",DIA_010:"Mergulha fundo dentro de ti, salta nestas plataformas e enfrenta os minijogos...",DIA_011:"...para tentares recolher pelo menos algum desse ferro perdido antes que te tornes uma boneca de trapos sem energia. Boa sorte!",DIA_012:"Cuidado com as cólicas menstruais! Usa as <KB>setas</KB><GP>D-pad</GP> para mover, <KB>Espaço ou W/CIMA</KB><GP>🟡</GP> para saltar e mantém <KB>Shift</KB><GP>🟢</GP> para correr. Podes olhar para baixo se não tiveres a certeza.",DIA_013:"Isto é uma cólica menstrual. Evita-a por agora, ou tenta destruí-la com a tua respiração (prime <KB>CTRL</KB><GP>🔴</GP>).",DIA_014:"Recarrega a tua energia com o ciclo de respiração que aprendeste. Tu consegues!",DIA_015:"Tens um desejo incontrolável de devorar tudo o que é doce num raio de cinco quilómetros? Compreendo-te perfeitamente.",DIA_016:"A tua missão é clara: tenta juntar estes pedaços de chocolate espalhados.",DIA_017:"Se conseguires fazê-lo sem perder o último resto de paciência, uma recompensa doce pode estar à tua espera no final.",DIA_018:"Organiza os pedaços individuais de chocolate na ordem correta.",DIA_019:"O chocolate está montado, NHAM! O açúcar é ótimo para um aumento instantâneo de humor e energia rápida (iupi, cérebro feliz!).",DIA_020:"Mas cuidado, há uma rasteira. Quando comes muitos doces de uma vez, o teu corpo entra numa montanha-russa louca.",DIA_021:"Primeiro voas até às nuvens, mas depois vem uma queda acentuada, de repente estás super cansada...",DIA_022:"...a tua barriga fica como um balão e essas cólicas rabugentas podem ficar ainda mais zangadas. Então, qual é o plano?",DIA_023:"O cansaço bateu forte e adorarias beber uma piscina de café? Espera! O teu corpo precisa de algo completamente diferente agora.",DIA_024:"A tua tarefa é ligar os canos para que a água limpa chegue até ti.",DIA_025:"Desvia o café para outro lugar, senão a tua barriga vai ficar muito rabugenta. Vamos à canalização!",DIA_026:"Conseguiste! A água limpa está a fluir e o café que só tornaria as tuas cólicas piores está bem longe.",DIA_027:"Bom trabalho, hidratação bem-sucedida reportada! Porque é que mandámos o café embora?",DIA_028:"A cafeína e um monte de açúcar agem no corpo como pequenos gremlins que contraem os teus vasos sanguíneos.",DIA_029:"Vasos mais estreitos significam pior fluxo sanguíneo e... adivinha? Cólicas muito mais fortes!",DIA_030:"E porquê beber água quando já te sentes como um balão de água ambulante? Parece estranho...",DIA_031:"...mas quando o teu corpo retém água, a melhor maneira de lhe dizer 'ei, já não precisas de a guardar' é beber ainda mais!",DIA_032:"A água limpa lava tudo muito bem e aquela sensação chata de inchaço vai finalmente desaparecer. Saúde!",DIA_033:"Já te perguntaste para onde vai todo o dinheiro do teu mealheiro todos os meses? Spoiler: Não são apenas doces.",DIA_034:"Ao longo da vida, a menstruação pode custar-te tanto como uma mala de luxo ou até um carro usado!",DIA_035:"Mas não é só dinheiro, o nosso planeta também paga o seu preço.",DIA_036:"Associa os valores de investimento vitalício aos produtos menstruais corretos.",DIA_037:"Pensa bem, um copo reutilizável custa mais ou menos do que 11.000 pensos descartáveis?",DIA_038:"Revela o impacto: Quando associares os preços corretamente, desbloqueias a pegada ecológica. Descobrirás quantos quilos de resíduos cada escolha deixa para trás!",DIA_039:"Os resultados surpreenderam-te? Para milhões de pessoas, até os pensos mais baratos são um luxo.",DIA_040:"Isto é pobreza menstrual e não é apenas um problema 'algures longe'.",DIA_041:"Na UE, 1 em cada 10 mulheres tem de escolher entre comida e pensos. Em todo o mundo, 500 milhões de pessoas carecem de necessidades básicas...",DIA_042:"...o que as obriga a usar trapos ou até jornais (ai!). Por causa disso, as raparigas perdem até 20% do ano letivo.",DIA_043:"A menstruação não é um luxo, é um direito. É hora de quebrar este ciclo!",DIA_044:"É hora de enfrentar a Grande Cólica! Usa o teu ferro para destruir os seus espinhos, mas cuidado, cada golpe custa-te mantimentos.",DIA_045:"Ficaste sem ferro? Vais sentir-te como uma bateria descarregada. Não te esqueças de respirar para encolher o monstro!",DIA_046:"Sobe as paredes e mostra a este ciclo quem manda. 4 – 2 – 6!",DIA_047:"Vitória! A cólica foi derrotada! Desviaste-te daquela bola gigante de agonia, usaste o ferro recolhido para destruir os seus espinhos...",DIA_048:"...e respiraste como uma verdadeira mestra zen. O grande chefe encolheu oficialmente a nada.",DIA_049:"O teu útero está em paz e tu és a campeã do ciclo. Vai comer um lanche, tu mereces!",DIA_050:"Ao recolheres tanto ferro, não só destruíste a cólica, como preparaste o teu corpo para o próximo grande regresso.",DIA_051:"Como perdes bastante ferro durante a menstruação, repô-lo é fundamental. É como combustível para a próxima fase do teu ciclo.",DIA_052:"Este ferro ajudará o teu corpo a construir um ambiente saudável e rico em oxigénio para o próximo óvulo e garantirá que não andes por aí como um zombie cansado o resto do mês.",DIA_053:"Ai... A cólica venceu (desta vez). Bem, isso não correu exatamente como planeado.",DIA_054:"Afinal, aquela bola gigante e espinhosa de sofrimento era mais rápida do que esperavas.",DIA_055:"Em vez de destruíres os seus espinhos com ferro, ela destruiu um pouco a tua vontade de te mexeres.",DIA_056:"Não te preocupes, a botija de água quente já está a aquecer para ti. Respira fundo (a sério desta vez!), descansa e prepara-te para a desforra. Ainda não acabou!",BTN_WALK:"Caminhar!",BTN_BREATHE:"Respirar!",BTN_START_BREATHING:"Começar a respirar",BTN_GOT_IT:"Entendido!",BTN_YES_MAAM:"Sim, senhora!",BTN_LETS_DO_THIS:"Vamos a isto!",BTN_START:"COMEÇAR",BTN_DEVOUR:"Devorar tudo!",BTN_PIECE:"Apenas um pedaço.",BTN_DRINK:"Vamos beber!",BTN_CONTINUE:"Continuar!",BTN_UNDERSTAND:"Eu compreendo!",BTN_CALCULATE:"Vamos calcular!",BTN_EVALUATE:"Avaliar!",BTN_YES:"Sim!",BTN_NO:"Nem por isso!",BTN_EXACTLY:"Exatamente!",BTN_BATTLE:"Para a batalha!",BTN_BACK_MENU:"Voltar ao menu!",BTN_RESTART:"Reiniciar!",BTN_NEXT:"Próximo",BTN_UNDERSTOOD:"Compreendido",BTN_TRY_AGAIN:"Tentar de novo!",BTN_RETRY_FIGHT:"Repetir combate",BTN_RESTART_CAVE:"Reiniciar cueva",BTN_BACK_MENU_UI:"Voltar ao menu",BTN_SKIP_INTRO:"Saltar intro",BTN_CREDITS:"CRÉDITOS",UI_DEVELOPER_MODE:"Modo de desenvolvedor",UI_WORK_IN_PROGRESS:"Trabalho em progresso",PRODUCT_PADS:"Pensos e tampões descartáveis",PRODUCT_PANTIES:"Cuecas menstruais",PRODUCT_CUP:"Copo menstrual",IMPACT_HIGH:`Alta
