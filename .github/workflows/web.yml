name: Test & deploy web build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.4.1
            ~/.local/share/godot/export_templates
          key: godot-4.4.1-web

      - name: Install Godot
        run: tools/setup_godot.sh

      - name: Run tests
        run: tools/test.sh

      - name: Export web build
        run: tools/export_web.sh

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r build/web/. site/
          # The original vibe-coded web prototype, for side-by-side comparison.
          mkdir -p site/original
          cp -r web-export/. site/original/
          touch site/.nojekyll

      # Publish to the gh-pages branch (GitHub Pages serves it at
      # https://bliksa.github.io/keeper/). Only the latest build is kept.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
