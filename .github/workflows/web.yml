name: Test & deploy web build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Commit of the backed-up game (level 1 only), see docs/ + README "Záloha".
  V1_SHA: e28f70129a4057e2e876f2266ba864b35dabb898

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.4.1
            ~/.local/share/godot/export_templates
          key: godot-4.4.1-web

      - name: Install Godot
        run: tools/setup_godot.sh

      - name: Run tests
        run: tools/test.sh

      - name: Export web build
        run: tools/export_web.sh

      # Playable backup of the game before level 2 (branch backup/v1-jaskyna),
      # served at /v1/. Built once per pinned commit and cached.
      - name: Cache v1 build
        id: v1cache
        uses: actions/cache@v4
        with:
          path: build/v1
          key: v1-${{ env.V1_SHA }}
      - name: Build v1 (backup)
        if: steps.v1cache.outputs.cache-hit != 'true'
        run: |
          git fetch --depth=1 origin "$V1_SHA"
          rm -rf /tmp/v1 && git worktree add /tmp/v1 "$V1_SHA"
          /tmp/v1/tools/export_web.sh
          mkdir -p build/v1 && cp -r /tmp/v1/build/web/. build/v1/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r build/web/. site/
          # Pages caches files for 10 min; a per-build pack name makes a reload
          # always fetch the new game data.
          PCK="index-${GITHUB_SHA::8}.pck"
          mv site/index.pck "site/$PCK"
          sed -i "s/GODOT_CONFIG = {/GODOT_CONFIG = {\"mainPack\":\"$PCK\",/; s/\"index.pck\":/\"$PCK\":/" site/index.html
          grep -q "\"mainPack\":\"$PCK\"" site/index.html
          # The original vibe-coded web prototype, for side-by-side comparison.
          mkdir -p site/original
          cp -r web-export/. site/original/
          # Backup of the game before level 2.
          mkdir -p site/v1
          cp -r build/v1/. site/v1/
          mv site/v1/index.pck "site/v1/index-${V1_SHA::8}.pck"
          sed -i "s/GODOT_CONFIG = {/GODOT_CONFIG = {\"mainPack\":\"index-${V1_SHA::8}.pck\",/; s/\"index.pck\":/\"index-${V1_SHA::8}.pck\":/" site/v1/index.html
          touch site/.nojekyll

      # Publish to the gh-pages branch (GitHub Pages serves it at
      # https://bliksa.github.io/keeper/). Only the latest build is kept.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
